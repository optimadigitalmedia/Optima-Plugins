name: Lint

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  php-syntax:
    name: PHP syntax check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      # Each plugin is linted only on the PHP versions its "Requires PHP" header
      # supports (optima-optimize needs 8.1, so it skips the 8.0 run).
      - name: Lint every PHP file
        run: |
          status=0
          for dir in */; do
            dir=${dir%/}
            main="$dir/$dir.php"
            req=$(grep -m1 -oP 'Requires PHP:\s*\K[0-9.]+' "$main" 2>/dev/null || echo 0)
            if php -r "exit(version_compare(PHP_VERSION, '$req', '>=') ? 0 : 1);"; then
              find "$dir" -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 -P4 php -l || status=1
            else
              echo "Skipping $dir: needs PHP $req"
            fi
          done
          exit $status

  core-contract:
    name: Optima Core contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Optima Core APIs other plugins depend on
        run: bash tools/core-contract.sh

  catalog:
    name: Feature catalog copies match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: catalog.json and optima-build/catalog.json are identical, valid JSON
        run: |
          python3 -m json.tool catalog.json > /dev/null
          cmp catalog.json optima-build/catalog.json || { echo "::error::optima-build/catalog.json differs from catalog.json. Copy the root file over."; exit 1; }

  admin-kit:
    name: Admin kit copies match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every plugin's copy of the Optima admin kit matches tools/admin-kit
        run: |
          status=0
          for f in */assets/optima-admin.css; do cmp -s "$f" tools/admin-kit/optima-admin.css || { echo "::error file=$f::differs from tools/admin-kit/optima-admin.css. Copy the kit file over."; status=1; }; done
          for f in */includes/class-optima-admin-ui.php; do cmp -s "$f" tools/admin-kit/class-optima-admin-ui.php || { echo "::error file=$f::differs from tools/admin-kit/class-optima-admin-ui.php. Copy the kit file over."; status=1; }; done
          exit $status

  design:
    name: Design module checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: DESIGN.md parser, token merge, contrast and optima_core_owns (no WordPress needed)
        run: php tools/tests/design.php
      - name: Admin kit files every Optima screen by the Site Standard §7 map
        run: php tools/tests/admin-kit-groups.php

  updater:
    name: Updater copies match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The first copy to load serves every Optima plugin on a site, so a copy
      # that drifts changes updates for all of them.
      - name: Every plugin's copy of the updater matches tools/updater
        run: |
          status=0
          for d in */; do
            d=${d%/}
            [ -f "$d/$d.php" ] || continue
            f="$d/includes/class-optima-plugin-updater.php"
            if [ ! -f "$f" ]; then echo "::error::$d has no includes/class-optima-plugin-updater.php"; status=1; continue; fi
            cmp -s "$f" tools/updater/class-optima-plugin-updater.php || { echo "::error file=$f::differs from tools/updater/class-optima-plugin-updater.php. Copy the source file over."; status=1; }
          done
          exit $status

  release-tests:
    name: Release channel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version picking (stable and test channels)
        run: php tools/tests/release-channel.php
      - name: Site health with test releases installed
        run: php tools/tests/fleet-checks.php
      - name: Promote dry run with made-up releases
        run: bash tools/tests/promote-dry-run.sh

  slop-check:
    name: Code slop check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Emoji, placeholders, debug output and stray copy files fail; filler
      # comments and visible em dashes warn. Rules: tools/slop-check.py.
      - name: Check for code slop
        run: python3 tools/slop-check.py
