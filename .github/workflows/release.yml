name: Release

# Publishes plugins as GitHub releases. Sites running a plugin pick the update
# up within a few hours.
#
# Automatically: every push to main (a merged pull request) checks each
# plugin's Version: header. Any plugin whose version has no release yet is
# released, Optima Core first. Bump the version and merge; that is the release.
# A plugin whose version did not change is skipped, so nothing ships by
# accident.
#
# By hand, as a backup: Actions tab -> Release -> "Run workflow" -> pick the
# plugin. Or push a tag: git tag optima-core-v1.0.2 && git push origin optima-core-v1.0.2
#
# Each release builds <slug>.zip from the plugin folder and attaches it, and
# the version list records the zip's sha256; sites check every download
# against it before installing.
#
# Nothing ships until the checks pass: the uniform check, the Optima Core
# contract, the client-names check on every tracked file, the updater and
# catalog copies, the "Run workflow" list, and every test in tools/tests that
# runs without WordPress (tools/tests/run-all.sh).
#
# Test channel: .github/release-channel decides how a release is published.
#   stable  a normal release. Every site takes it within a few hours.
#   test    a GitHub pre-release (a test release). Only sites on the test
#           channel (the agency's own staging site) take it. After it is
#           checked there, the Promote workflow marks it as a normal release
#           and every other site takes it. Promote never rebuilds the zip.
# The file is read at the commit being released, so a change to it applies
# from the next release on. A missing or unknown value means stable.

on:
  push:
    branches: [main]
    tags:
      - 'optima-*-v*'
  workflow_dispatch:
    inputs:
      plugin:
        description: Which plugin to release (version comes from its header)
        required: true
        type: choice
        # Written by tools/release/dispatch-list.py from the plugin folders;
        # the Lint workflow fails when it drifts.
        options:
          - optima-core
          - optima-accessibility
          - optima-aeo
          - optima-analytics
          - optima-build
          - optima-cards
          - optima-chat
          - optima-contact
          - optima-crm
          - optima-events
          - optima-forms-guard
          - optima-hours
          - optima-members
          - optima-optimize
          - optima-partners
          - optima-redirects
          - optima-results
          - optima-reviews
          - optima-sitecheck
          - optima-team

permissions:
  contents: write

jobs:
  checks:
    name: Checks before anything ships
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Uniform check (plugin-first rule 15)
        run: bash tools/uniform-check.sh plugins .

      - name: Optima Core contract
        run: bash tools/core-contract.sh

      - name: No client names in any tracked file
        run: python3 -I tools/client-names.py --all

      - name: Every plugin's updater copy matches tools/updater
        run: bash tools/updater/sync.sh --check

      - name: catalog.json and optima-build/catalog.json are identical, valid JSON
        run: |
          python3 -m json.tool catalog.json > /dev/null
          cmp catalog.json optima-build/catalog.json || { echo "::error::optima-build/catalog.json differs from catalog.json. Copy the root file over."; exit 1; }

      - name: The "Run workflow" list names every plugin
        run: python3 -I tools/release/dispatch-list.py --check

      - name: Every test that runs without WordPress
        run: bash tools/tests/run-all.sh

  plan:
    name: Find versions that have not shipped
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      any: ${{ steps.plan.outputs.any }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out which plugins, which versions, which tags
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PICKED: ${{ inputs.plugin }}
        run: |
          set -euo pipefail

          # No `head` here on purpose: under `set -o pipefail` an early-closing
          # pipe can fail the step. A plugin header carries exactly one
          # Version: line, so this needs no truncation.
          header_version() {
            sed -n 's/^ \* Version: *//p' "$1/$1.php" | tr -d '[:space:]'
          }

          slugs=()
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            slugs=("${PICKED}")
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            slug="${tag%-v*}"
            if [ ! -f "${slug}/${slug}.php" ]; then
              echo "::error::Tag '${tag}' does not match a plugin: ${slug}/${slug}.php not found."
              exit 1
            fi
            if [ "$(header_version "${slug}")" != "${tag##*-v}" ]; then
              echo "::error::${slug}.php says Version $(header_version "${slug}"), tag says ${tag##*-v}. Bump the header first."
              exit 1
            fi
            slugs=("${slug}")
          else
            # Push to main: every plugin, Optima Core first (the others call it).
            [ -f optima-core/optima-core.php ] && slugs+=("optima-core")
            for dir in optima-*/; do
              slug="${dir%/}"
              [ "${slug}" = "optima-core" ] && continue
              [ -f "${slug}/${slug}.php" ] && slugs+=("${slug}")
            done
          fi

          targets="[]"
          for slug in "${slugs[@]}"; do
            if [ ! -f "${slug}/${slug}.php" ]; then
              echo "::error::No such plugin: ${slug}/${slug}.php not found."
              exit 1
            fi
            version="$(header_version "${slug}")"
            if [ -z "${version}" ]; then
              echo "::error::${slug}.php has no readable Version: header."
              exit 1
            fi
            tag="${slug}-v${version}"
            if gh release view "${tag}" >/dev/null 2>&1; then
              if [ "${EVENT}" = "push" ] && [[ "${GITHUB_REF}" == refs/heads/* ]]; then
                echo "${tag}: already released, skipping."
                continue
              fi
              echo "::error::Release ${tag} already exists. Bump the version and try again; never re-tag a shipped version."
              exit 1
            fi
            echo "${tag}: will release."
            targets="$(jq -c --arg s "${slug}" --arg v "${version}" --arg t "${tag}" '. + [{slug:$s, version:$v, tag:$t}]' <<< "${targets}")"
          done

          channel="$(tr -d '[:space:]' < .github/release-channel 2>/dev/null || true)"
          [ "${channel}" = "test" ] || channel="stable"
          echo "Release channel: ${channel}"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          if [ "${targets}" = "[]" ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi

  release:
    name: Release ${{ matrix.target.tag }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One at a time, in plan order, so Optima Core ships before the plugins that use it.
      max-parallel: 1
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}

    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: find "${{ matrix.target.slug }}" -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build the zip
        run: |
          slug="${{ matrix.target.slug }}"
          # Zip the plugin folder itself so it unpacks to wp-content/plugins/<slug>/.
          zip -r "${slug}.zip" "${slug}" -x '*.DS_Store' -x '*/.git/*' >/dev/null
          unzip -l "${slug}.zip"
          sha256sum "${slug}.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          slug="${{ matrix.target.slug }}"
          version="${{ matrix.target.version }}"
          tag="${{ matrix.target.tag }}"

          notes="$(sed -n "/^## \[\?${version}\]\?/,/^## /p" "${slug}/CHANGELOG.md" 2>/dev/null | sed '$d')"
          if [ -z "${notes}" ]; then
            notes="See ${slug}/CHANGELOG.md."
          fi

          # Test channel: publish as a pre-release. Stable sites ignore it until
          # the Promote workflow marks it as a normal release.
          flags=()
          if [ "${CHANNEL}" = "test" ]; then
            flags+=(--prerelease)
          fi

          # --target creates the tag at this commit when it does not exist yet.
          gh release create "${tag}" "${slug}.zip" \
            --target "${GITHUB_SHA}" \
            --title "${slug} ${version}" \
            --notes "${notes}" \
            "${flags[@]}"

          if [ "${CHANNEL}" = "test" ]; then
            echo "Published ${tag} as a test release. Check it on the test site, then run Promote."
          else
            echo "Published ${tag}"
          fi

      - name: Record the zip's sha256 for the version list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          slug="${{ matrix.target.slug }}"
          tag="${{ matrix.target.tag }}"
          built="$(sha256sum "${slug}.zip" | cut -d' ' -f1)"
          url="https://github.com/${GH_REPO}/releases/download/${tag}/${slug}.zip"
          # GitHub's own digest of the uploaded asset must match the zip built here.
          digest="$(gh api "repos/${GH_REPO}/releases/tags/${tag}" --jq ".assets[] | select(.name == \"${slug}.zip\") | .digest // \"\"")"
          digest="${digest#sha256:}"
          if [ -n "${digest}" ] && [ "${digest}" != "${built}" ]; then
            echo "::error::${tag}: GitHub's digest ${digest} differs from the built zip ${built}. The version list will not be published."
            exit 1
          fi
          mkdir -p sha256
          echo "${url} ${built}" > "sha256/${tag}.sha256"
          echo "${tag}: sha256 ${built}"

      - name: Hand the sha256 to the version list job
        uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ matrix.target.tag }}
          path: sha256/${{ matrix.target.tag }}.sha256
          retention-days: 7

  feed:
    # Sites read this one file to learn every version, instead of GitHub's API.
    # The API allows 60 calls an hour per server address, and shared hosts
    # (WP Engine) run out, which made sites show "Up to date" when they were
    # not. A plain file download has no such limit.
    name: Publish the version list
    needs: [plan, release]
    # One writer at a time: Release and Promote both rewrite the list.
    concurrency:
      group: version-list
      cancel-in-progress: false
    if: ${{ always() && needs.plan.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the sha256 of each zip released in this run
        if: needs.plan.outputs.any == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: sha256-*
          merge-multiple: true
          path: sha256

      # The catalog is written beside the list: catalog-test.json from this
      # commit, catalog.json only on the stable switch (Promote sends it out
      # on the test switch). Optima Build reads it from here, never from main.
      - name: Build releases.json and the catalog, publish them on the version-list branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          SHA256_DIR: sha256
        run: bash tools/release/publish-feed.sh
