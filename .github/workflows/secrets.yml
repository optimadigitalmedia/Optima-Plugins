# Secret scanning: fails when a commit being added contains an API key, token,
# password or private key. Rules: .gitleaks.toml. Only the new commits are
# scanned; secrets are redacted in the log.
name: Secrets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: No secrets in new commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned by version and checksum. The sha256 is the linux_x64 line of the
      # release's own gitleaks_8.21.2_checksums.txt (checked against the
      # downloaded file on 2026-11-12). To upgrade: change both lines together,
      # taking the new sha256 from that version's checksums file.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.21.2
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          file="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${file}" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${file}"
          echo "${SHA256}  ${RUNNER_TEMP}/${file}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${file}" -C /usr/local/bin gitleaks

      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --quiet
            RANGE="origin/${BASE_REF}..HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then
            RANGE="${BEFORE}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Scanning ${RANGE}"
          gitleaks detect --config .gitleaks.toml --log-opts="${RANGE}" --redact --no-banner --verbose
